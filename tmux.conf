# Reload tmux config
bind r source-file ~/.tmux.conf

# improve colors
set -g default-terminal 'screen-256color'

# Set prefix key to C-a instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix using (alt + arrow_key)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Open Claude Code in a stacked (top/bottom) split, in the current dir
bind C split-window -v -c "#{pane_current_path}" "claude"

# Split side-by-side (left/right), in the current dir
bind ! split-window -h -c "#{pane_current_path}"


# Mouse mode: click a pane to focus it, scroll, resize, select windows
set -g mouse on

# Start numbering at 1
set -g base-index 1


# Set status bar
set -g status-bg black
set -g status-fg white
set -g status-left ""
set -g status-right "#[fg=green]#H"

